<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍스트 → MP3</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #121212;
    color: #fff;
    font-family: -apple-system, "Noto Sans KR", sans-serif;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #181818;
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #b3b3b3; font-size: 13px; margin: 0 0 24px; }
  a.download {
    display: block;
    background: #1ed760;
    color: #000;
    font-weight: 700;
    text-decoration: none;
    padding: 14px;
    border-radius: 28px;
    font-size: 15px;
  }
  .note {
    margin-top: 20px;
    color: #b3b3b3;
    font-size: 12px;
    text-align: left;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>텍스트 → MP3</h1>
    <p class="sub">오프라인 음성 변환 · 서버 없음 · v0.1</p>
    <a class="download" href="TextToAudio.apk" download>APK 다운로드</a>
    <div class="note">
      설치 전 안드로이드에서 "출처를 알 수 없는 앱 설치" 허용이 필요할 수 있어요
      (설정 → 앱 → 브라우저/파일 앱 → 권한에서 허용).
    </div>
  </div>
</body>
</html>
